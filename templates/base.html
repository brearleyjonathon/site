<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{root}}favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{root}}favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{root}}style.css">

<script>
// Apply saved preferences before first paint, so nothing flashes.
(function () {
  var root = document.documentElement;
  var defaultTheme = "{{default_theme}}";
  var defaultFont = "{{default_font}}";
  try {
    var theme = localStorage.getItem("theme");
    var font = localStorage.getItem("font");
  } catch (e) {}
  if (!theme) {
    theme = defaultTheme === "auto"
      ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : defaultTheme;
  }
  root.setAttribute("data-theme",
    theme === "dark" ? "dark" : theme === "fun" ? "fun" : "light");
  root.setAttribute("data-font", font === "serif" || (!font && defaultFont === "serif") ? "serif" : "sans");
  try { var fun = localStorage.getItem("fun-mode"); root.setAttribute("data-fun", fun === "source" || fun === "cursor" ? "source" : "field"); } catch (e) {}
})();
</script>
</head>

<body>

<svg class="filters" aria-hidden="true" focusable="false" width="0" height="0">
  <filter id="fun-warp" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.0055"
                  numOctaves="1" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- The hand the animals, the water and the splash are drawn in: a small
       wobble over every stroke, so they read as pencil rather than vector. -->
  <filter id="ink-sketch" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2"
                  seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="page">

  <header class="masthead">
    <div class="identity">
      <h1 class="name">{{name}}</h1>
      {{tagline}}
    </div>

    <div class="controls">
      <div class="theme-group">
        <div class="switch" role="group" aria-label="Colour theme">
          <button type="button" data-set-theme="light">Light</button>
          <button type="button" data-set-theme="dark">Dark</button>
          <button type="button" data-set-theme="fun">Fun</button>
        </div>
        <div class="fun-controls">
          <div class="switch pill" role="group" aria-label="Where the colour is">
            <svg class="pill-line" aria-hidden="true" focusable="false"><path/></svg>
            <span class="thumb" aria-hidden="true"></span>
            <button type="button" data-set-fun="source">Source</button>
            <button type="button" data-set-fun="field">Field</button>
          </div>
        </div>
      </div>
      <div class="switch" role="group" aria-label="Typeface">
        <button type="button" data-set-font="sans">Sans</button>
        <button type="button" data-set-font="serif">Serif</button>
      </div>
    </div>
  </header>

  <main>
{{sections}}
  </main>

  <footer class="colophon">{{footer}}</footer>

</div>

<div class="blobs" aria-hidden="true">
  <div class="pools">
    <span class="blob"></span>
    <span class="blob"></span>
    <span class="blob"></span>
    <span class="blob"></span>
    <span class="blob"></span>
  </div>
  <canvas class="trail" aria-hidden="true"></canvas>
</div>
<script src="{{root}}app.js"></script>
</body>
</html>
